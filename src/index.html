    />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      try {
        var t =
          new URLSearchParams(location.search).get('theme') || localStorage.getItem('krm-theme');
        if (t && /^(heritage|horizon|evergreen|midnight)$/.test(t))
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
